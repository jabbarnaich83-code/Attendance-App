<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mullazmeen Attendance</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f8;
margin:0;
padding:15px;
}

.box{
max-width:600px;
margin:auto;
background:white;
padding:18px;
border-radius:12px;
}

h1,h2{
text-align:center;
}

.card{
background:#f8f8f8;
padding:18px;
margin:15px 0;
border-radius:12px;
}

input,select,button{
width:100%;
padding:14px;
margin:7px 0;
box-sizing:border-box;
font-size:17px;
border-radius:8px;
}

input,select{
border:1px solid #999;
background:white;
}

button{
border:none;
color:white;
}

.add{
background:#1976d2;
}

.present{
background:#2e7d32;
}

.absent{
background:#d32f2f;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
padding:15px;
border-radius:10px;
text-align:center;
background:white;
border:1px solid #ddd;
}

.stat b{
display:block;
font-size:28px;
margin-top:5px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

th{
background:#eeeeee;
}
</style>
</head>

<body>

<div class="box">

<h1>👨‍💼 Mullazmeen Attendance</h1>


<!-- DASHBOARD -->

<div class="card">

<h2>📊 Dashboard</h2>

<div class="stats">

<div class="stat">
👥 کل ملازمین
<b id="totalEmployees">0</b>
</div>

<div class="stat">
📅 آج کی تاریخ
<b id="todayDate">-</b>
</div>

<div class="stat">
✅ آج حاضر
<b id="todayPresent">0</b>
</div>

<div class="stat">
❌ آج غیر حاضر
<b id="todayAbsent">0</b>
</div>

</div>

</div>


<!-- ADD EMPLOYEE -->

<div class="card">

<h2>Mullazm Add Karein</h2>

<input id="employeeName" type="text"
placeholder="Mullazm ka naam">

<input id="employeeId" type="text"
placeholder="Employee ID">

<input id="department" type="text"
placeholder="Department">

<button class="add" onclick="addEmployee()">
Mullazm Add Karein
</button>

</div>


<!-- ATTENDANCE -->

<div class="card">

<h2>Attendance</h2>

<select id="employeeSelect">
<option value="">Mullazm Select Karein</option>
</select>

<input id="attendanceDate" type="date">

<button class="present"
onclick="markAttendance('حاضر')">
حاضر
</button>

<button class="absent"
onclick="markAttendance('غیر حاضر')">
غیر حاضر
</button>

</div>


<!-- EMPLOYEES -->

<div class="card">

<h2>👥 Mullazmeen</h2>

<table>

<thead>
<tr>
<th>Naam</th>
<th>ID</th>
<th>Department</th>
</tr>
</thead>

<tbody id="employeeTable"></tbody>

</table>

</div>


<!-- ATTENDANCE RECORD -->

<div class="card">

<h2>📋 Attendance Record</h2>

<table>

<thead>
<tr>
<th>Naam</th>
<th>Date</th>
<th>Status</th>
</tr>
</thead>

<tbody id="attendanceTable"></tbody>

</table>

</div>

</div>


<script>

let employees =
JSON.parse(localStorage.getItem("employees") || "[]");

let attendance =
JSON.parse(localStorage.getItem("attendance") || "[]");


const employeeName =
document.getElementById("employeeName");

const employeeId =
document.getElementById("employeeId");

const department =
document.getElementById("department");

const employeeSelect =
document.getElementById("employeeSelect");

const attendanceDate =
document.getElementById("attendanceDate");

const employeeTable =
document.getElementById("employeeTable");

const attendanceTable =
document.getElementById("attendanceTable");

const totalEmployees =
document.getElementById("totalEmployees");

const todayDate =
document.getElementById("todayDate");

const todayPresent =
document.getElementById("todayPresent");

const todayAbsent =
document.getElementById("todayAbsent");


let today =
new Date().toISOString().slice(0,10);

attendanceDate.value = today;

todayDate.innerText = today;


function saveData(){

localStorage.setItem(
"employees",
JSON.stringify(employees)
);

localStorage.setItem(
"attendance",
JSON.stringify(attendance)
);

}


function addEmployee(){

let name =
employeeName.value.trim();

let id =
employeeId.value.trim();

let dept =
department.value.trim();


if(name === "" || id === ""){

alert("Naam aur Employee ID likhein");

return;

}


employees.push({

name:name,
id:id,
department:dept

});


saveData();

employeeName.value="";
employeeId.value="";
department.value="";

showData();

alert("Mullazm add ho gaya ✅");

}


function markAttendance(status){

let selected =
employeeSelect.value;


if(selected === ""){

alert("Pehle Mullazm select karein");

return;

}


let employee =
employees[Number(selected)];


attendance.push({

name:employee.name,

date:attendanceDate.value,

status:status

});


saveData();

showData();

alert("Attendance lag gayi ✅");

}


function showData(){

employeeSelect.innerHTML =
'<option value="">Mullazm Select Karein</option>';


employees.forEach(function(employee,index){

employeeSelect.innerHTML +=
'<option value="' + index + '">' +
employee.name + ' - ' +
employee.id +
'</option>';

});


employeeTable.innerHTML="";


employees.forEach(function(employee){

employeeTable.innerHTML +=

'<tr>' +
'<td>' + employee.name + '</td>' +
'<td>' + employee.id + '</td>' +
'<td>' + employee.department + '</td>' +
'</tr>';

});


attendanceTable.innerHTML="";


attendance
.slice()
.reverse()
.forEach(function(record){

attendanceTable.innerHTML +=

'<tr>' +
'<td>' + record.name + '</td>' +
'<td>' + record.date + '</td>' +
'<td>' + record.status + '</td>' +
'</tr>';

});


updateDashboard();

}


function updateDashboard(){

totalEmployees.innerText =
employees.length;


let selectedDate =
attendanceDate.value || today;


let present = 0;
let absent = 0;


attendance.forEach(function(record){

if(record.date === selectedDate){

if(record.status === "حاضر"){
present++;
}

if(record.status === "غیر حاضر"){
absent++;
}

}

});


todayPresent.innerText = present;

todayAbsent.innerText = absent;

todayDate.innerText = selectedDate;

}


attendanceDate.addEventListener(
"change",
updateDashboard
);


showData();

</script>

</body>
</html>
