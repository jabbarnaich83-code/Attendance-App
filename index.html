<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mullazmeen Attendance App</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:15px;
}
.container{
    max-width:600px;
    margin:auto;
}
h1,h2{
    text-align:center;
}
.card{
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:12px;
    box-shadow:0 2px 8px #ccc;
}
input,select,button{
    width:100%;
    padding:12px;
    margin:6px 0;
    box-sizing:border-box;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}
button{
    border:none;
    color:white;
    cursor:pointer;
}
.add{
    background:#1976d2;
}
.present{
    background:#2e7d32;
}
.absent{
    background:#d32f2f;
}
.delete{
    background:#777;
    padding:7px;
    font-size:13px;
}
.stats{
    display:flex;
    gap:8px;
}
